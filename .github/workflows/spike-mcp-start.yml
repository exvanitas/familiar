name: spike-mcp-start

# Step 2's third spike: a small Rust command starting local MCP servers on Windows.
on:
  workflow_dispatch:
  push:
    branches: [spike/mcp-start]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, pnpm from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install uv==0.13.5
      - name: Versions
        run: |
          node --version
          npm --version
          (Get-Command npx).Source
          (Get-Command uvx).Source
          uvx --version
          python --version
          cd spikes/mcp-start
          rustc --version
          cargo --version
      - name: Build
        working-directory: spikes/mcp-start
        run: cargo build --release --locked
      - name: Cases a, b, c, d, f, g
        env:
          FAMILIAR_SPIKE_PARENT_ONLY: leak-me-if-you-can
        run: spikes/mcp-start/target/release/mcp-start.exe cases
      - name: Case e, kill the app hard with servers in a job
        if: always()
        run: spikes/mcp-start/target/release/mcp-start.exe kill-test
      - name: Case e, a second look from PowerShell
        if: always()
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -in 'node.exe','python.exe','uv.exe','uvx.exe','mcp-server-time.exe','cmd.exe','mcp-start.exe' } |
            Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-Table -AutoSize -Wrap
      - name: Case e control, the same without a job
        if: always()
        run: spikes/mcp-start/target/release/mcp-start.exe kill-test --no-job
