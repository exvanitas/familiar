name: shell-win

# The reparse walk on Windows: links read without following them, and paths that would reach a
# share refused with no SMB traffic. See "5b. Starting a local MCP server" in docs/shell-design.md.
on:
  push:
    paths:
      - apps/desktop/shell-core/**
      - apps/desktop/shell-win/**
      - .github/workflows/shell-win.yml

permissions:
  contents: read

jobs:
  reparse:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop/shell-win
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup reads apps/desktop/rust-toolchain.toml. This builds everything the watched step runs.
      - name: Build, and the tests that need no fixtures
        run: cargo test --locked

      # The verdict below needs every sample: a count that was never saved, or one with no open
      # count, must throw rather than pass.
      - name: The SMB counts can't pass unmeasured
        run: |
          . ./smb-counts.ps1
          $threw = $false
          try { Read-SmbCounts never-saved | Out-Null } catch { $threw = $true }
          if (-not $threw) { Write-Host 'A missing sample was read as a measurement.'; exit 1 }
          '{"pairs":[]}' | Set-Content "$env:RUNNER_TEMP\smb-no-opens.json"
          $threw = $false
          try { Read-SmbCounts no-opens | Out-Null } catch { $threw = $true }
          if (-not $threw) { Write-Host 'A sample with no open count was read as a measurement.'; exit 1 }
          Write-Host 'Missing samples throw.'

      - name: Make the fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $fx = 'C:\familiar-reparse'
          New-Item -ItemType Directory -Force "$fx\local\bin" | Out-Null
          Set-Content "$fx\local\bin\tool.exe" 'a placeholder, never run'
          # The share is C$ of this runner, so its root is C:\.
          New-Item -ItemType Directory -Force 'C:\familiar-fx' | Out-Null
          Set-Content 'C:\familiar-fx\tool.exe' 'a placeholder, never run'
          $unc = '\\localhost\C$'
          try {
            New-SmbMapping -LocalPath 'Z:' -RemotePath $unc -ErrorAction Stop | Format-List LocalPath, RemotePath, Status
          } catch {
            Write-Host "Mapping $unc failed ($_). Using a share of our own."
            New-Item -ItemType Directory -Force 'C:\familiar-share\familiar-fx' | Out-Null
            Set-Content 'C:\familiar-share\familiar-fx\tool.exe' 'a placeholder, never run'
            New-SmbShare -Name familiar-share -Path 'C:\familiar-share' -FullAccess Everyone | Out-Null
            $unc = '\\localhost\familiar-share'
            New-SmbMapping -LocalPath 'Z:' -RemotePath $unc -ErrorAction Stop | Format-List LocalPath, RemotePath, Status
          }
          # The share works, so a refusal later is the walk's doing, not a dead share.
          Get-ChildItem 'Z:\familiar-fx' | Format-Table Name, Length
          New-Item -ItemType Junction -Path "$fx\j-local" -Target "$fx\local" | Out-Null
          New-Item -ItemType SymbolicLink -Path "$fx\s-share" -Target $unc | Out-Null
          New-Item -ItemType SymbolicLink -Path "$fx\s-mapped" -Target 'Z:\' | Out-Null
          "FAMILIAR_REPARSE_FIXTURES=$fx" >> $env:GITHUB_ENV
          "FAMILIAR_REPARSE_UNC=$unc" >> $env:GITHUB_ENV
          "FAMILIAR_REPARSE_MAPPED=Z" >> $env:GITHUB_ENV
          $env:FAMILIAR_REPARSE_FIXTURES = $fx
          $env:FAMILIAR_REPARSE_UNC = $unc
          $env:FAMILIAR_REPARSE_MAPPED = 'Z'
          # A junction to the share: New-Item and mklink won't write one, so the test crate does.
          cargo test --locked --offline --test reparse -- --ignored make_the_junction_to_the_share --nocapture
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem $fx | Format-Table Name, LinkType, Target

      - name: Before, then start the capture on port 445
        run: |
          . ./smb-counts.ps1
          Save-SmbCounts before | Out-Null
          pktmon filter remove | Out-Null
          pktmon filter add smb -p 445
          pktmon start --capture --pkt-size 0 --file-name "$env:RUNNER_TEMP\walk.etl"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: The reparse walk, watched
        run: cargo test --locked --offline --test reparse -- --nocapture --test-threads 1

      # The verdict rests on the SMB server's open count and the SMB connections, both required.
      # pktmon is reported too, but the share is this runner's own, so its traffic is loopback,
      # which pktmon never sees: the control below shows that.
      - name: After, and the verdict
        if: always()
        run: |
          . ./smb-counts.ps1
          pktmon stop
          pktmon format "$env:RUNNER_TEMP\walk.etl" -o "$env:RUNNER_TEMP\walk.txt" | Out-Null
          $packets = @(Get-Content "$env:RUNNER_TEMP\walk.txt" | Where-Object { $_ -match '\.445[ :>]' }).Count
          $after = Save-SmbCounts after
          $d = Compare-SmbCounts (Read-SmbCounts before) $after
          $lines = @(
            "New SMB connections during the walk: $($d.new.Count) $($d.new -join ', ')",
            "SMB server opens during the walk: $($d.opens)",
            "pktmon packets on port 445 during the walk: $packets"
          )
          $lines | ForEach-Object { Write-Host $_ }
          "## The reparse walk" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$env:FAMILIAR_REPARSE_FIXTURES\reparse-results.txt") { Get-Content "$env:FAMILIAR_REPARSE_FIXTURES\reparse-results.txt" >> $env:GITHUB_STEP_SUMMARY }
          $lines >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if ($d.new.Count -gt 0 -or $d.opens -gt 0 -or $packets -gt 0) { Write-Host 'The walk made SMB traffic.'; exit 1 }

      # A positive control: the same counts, sampled the same way, while this step really uses the
      # share, through the mapping and through a new connection. Both must move, or they prove
      # nothing above and the run fails.
      - name: Control, the share really used
        if: always()
        run: |
          . ./smb-counts.ps1
          $before = Save-SmbCounts control-before
          pktmon start --capture --pkt-size 0 --file-name "$env:RUNNER_TEMP\control.etl" | Out-Null
          Get-Content 'Z:\familiar-fx\tool.exe' | Out-Null
          $other = $env:FAMILIAR_REPARSE_UNC -replace '^\\\\localhost', '\\127.0.0.1'
          Get-ChildItem "$other\familiar-fx" | Out-Null
          Start-Sleep -Seconds 1
          pktmon stop | Out-Null
          pktmon format "$env:RUNNER_TEMP\control.etl" -o "$env:RUNNER_TEMP\control.txt" | Out-Null
          $packets = @(Get-Content "$env:RUNNER_TEMP\control.txt" | Where-Object { $_ -match '\.445[ :>]' }).Count
          $d = Compare-SmbCounts $before (Save-SmbCounts control-after)
          $lines = @(
            "Control: new SMB connections $($d.new.Count) $($d.new -join ', ')",
            "Control: SMB server opens $($d.opens)",
            "Control: pktmon packets on port 445 $packets"
          )
          if ($packets -eq 0) { $lines += 'pktmon saw none of the control either: it is blind to loopback SMB, so its count above proves nothing' }
          $lines | ForEach-Object { Write-Host $_ }
          "## Control" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $lines >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if ($d.opens -le 0) { Write-Host 'The server open count did not move when the share was used, so it proves nothing.'; exit 1 }
          if ($d.new.Count -le 0) { Write-Host 'No new SMB connection showed when one was made, so that count proves nothing.'; exit 1 }

      - name: Clean up the mapping
        if: always()
        run: Remove-SmbMapping -LocalPath 'Z:' -Force -ErrorAction SilentlyContinue
