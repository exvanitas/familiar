[package]
name = "shell-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
description = "What Familiar's native shell decides, with no Tauri and no OS calls, so its tests run anywhere."

[dependencies]
# The same URL parser reqwest uses, so the shell and the fetch read an address the same way.
url = "=2.5.8"
aho-corasick = "=1.1.5"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
